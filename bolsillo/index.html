<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bolsillo</title>
<meta name="description" content="Bolsillo: tus finanzas y tu bóveda de enlaces e imágenes, 100% local en tu teléfono.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D5B4B">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bolsillo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app" class="app-shell">
  <header class="topbar">
    <h1 id="topbarTitle">Bolsillo</h1>
    <button class="icon-btn" id="topbarAction" data-action="goto-ajustes" aria-label="Ajustes"></button>
  </header>
  <main id="main" aria-live="polite"></main>
  <nav class="tabbar" aria-label="Navegación principal">
    <button class="tab" data-action="nav" data-view="inicio" aria-label="Inicio"></button>
    <button class="tab" data-action="nav" data-view="movimientos" aria-label="Movimientos"></button>
    <button class="tab-fab" data-action="open-tx" aria-label="Registrar movimiento"></button>
    <button class="tab" data-action="nav" data-view="presupuesto" aria-label="Presupuesto"></button>
    <button class="tab" data-action="nav" data-view="boveda" aria-label="Bóveda"></button>
  </nav>
</div>
<div class="sheet-overlay" id="sheetOverlay" hidden>
  <div class="sheet" id="sheetContent" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="imageInput" accept="image/*" multiple hidden>

<script src="./js/db.js"></script>
<script src="./js/format.js"></script>
<script src="./js/state.js"></script>
<script src="./js/charts.js"></script>
<script src="./js/backup.js"></script>
<script src="./js/views/inicio.js"></script>
<script src="./js/views/movimientos.js"></script>
<script src="./js/views/presupuesto.js"></script>
<script src="./js/views/boveda.js"></script>
<script src="./js/views/ajustes.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
