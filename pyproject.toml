[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "BLE", "S110", "RUF"]
ignore = ["RUF005"]  # concatenar listas de líneas es más legible aquí

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint.per-file-ignores]
"tests/test_app_security.py" = ["RUF001"]  # dígitos unicode a propósito
