name: Desplegar Bot Oreo a Render

on:
  push:
    branches: [main, claude/new-session-8y5oft]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy hook de Render
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::error::Falta el secreto RENDER_DEPLOY_HOOK_URL. Crea el servicio en Render y agrega su Deploy Hook como secreto del repositorio."
            exit 1
          fi
          curl -fsS -X POST "$HOOK_URL"
